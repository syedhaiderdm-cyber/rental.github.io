<style>
  :root{
    --pine:#1F3A2E;
    --pine-dark:#152A21;
    --stone:#EEE8DA;
    --stone-deep:#E2DACA;
    --brass:#B08D57;
    --brass-light:#D9B98A;
    --ink:#2B2B26;
    --ink-soft:#6B6558;
    --card:#FFFDF8;
    --line:#DCD3BE;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .rui{
    font-family:'Work Sans', sans-serif;
    background:var(--stone);
    color:var(--ink);
    min-height:100%;
    padding-bottom:48px;
  }
  .rui h1,.rui h2,.rui h3,.rui .display{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }

  /* ---- Header / hero ---- */
  .rui-top{
    background:linear-gradient(180deg, var(--pine) 0%, var(--pine-dark) 100%);
    color:#F3EFE4;
    padding:28px 24px 0;
    position:relative;
    overflow:hidden;
  }
  .rui-eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--brass-light);
    margin:0 0 6px;
    font-weight:600;
  }
  .rui-top h1{
    font-size:clamp(24px,4vw,34px);
    margin:0 0 4px;
    color:#FBF8F0;
  }
  .rui-sub{
    margin:0 0 22px;
    color:#C9C2AE;
    font-size:14px;
    max-width:520px;
  }

  /* mountain ridge signature motif */
  .rui-ridge{
    display:block;
    width:100%;
    height:46px;
    margin-top:4px;
  }
  .rui-ridge path{ fill:var(--stone); }
  .rui-ridge .ridge-line{ fill:none; stroke:var(--brass); stroke-width:1.5; opacity:0.55; }

  /* ---- Search ---- */
  .rui-search-wrap{
    position:relative;
    max-width:640px;
    margin-bottom:22px;
  }
  .rui-search{
    width:100%;
    padding:14px 16px 14px 44px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.08);
    color:#FBF8F0;
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    outline:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .rui-search::placeholder{ color:#B8B19C; }
  .rui-search:focus{
    background:rgba(255,255,255,0.14);
    border-color:var(--brass);
  }
  .rui-search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    opacity:0.7;
  }
  .rui-clear{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#C9C2AE;
    cursor:pointer;
    font-size:13px;
    padding:4px 8px;
    display:none;
    font-family:'Work Sans',sans-serif;
  }
  .rui-clear.show{ display:block; }

  /* ---- Tabs ---- */
  .rui-tabs-outer{
    background:var(--stone);
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .rui-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px 24px;
    scrollbar-width:thin;
  }
  .rui-tabs::-webkit-scrollbar{ height:6px; }
  .rui-tabs::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .rui-tab{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .rui-tab:hover{ border-color:var(--brass); color:var(--ink); }
  .rui-tab.active{
    background:var(--pine);
    border-color:var(--pine);
    color:#F3EFE4;
  }
  .rui-tab .count{
    font-size:11px;
    padding:1px 6px;
    border-radius:999px;
    background:rgba(0,0,0,0.08);
    color:inherit;
    opacity:0.75;
  }
  .rui-tab.active .count{ background:rgba(255,255,255,0.18); }

  /* ---- Subcategory chips ---- */
  .rui-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:16px 24px 0;
  }
  .rui-chip{
    padding:6px 13px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    font-weight:500;
  }
  .rui-chip:hover{ border-color:var(--brass); }
  .rui-chip.active{
    background:var(--brass);
    border-color:var(--brass);
    color:#2B2109;
  }

  /* ---- Results meta ---- */
  .rui-meta{
    padding:18px 24px 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .rui-meta b{ color:var(--ink); }

  /* ---- Grid ---- */
  .rui-results{ padding:16px 24px 0; }
  .rui-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:14px;
  }
  .rui-grid + .rui-section-label{ margin-top:10px; }
  .rui-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .rui-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(31,58,46,0.10);
  }
  .rui-card-swatch{
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rui-card-swatch svg{ width:30px; height:30px; opacity:0.85; }
  .rui-card-body{ padding:12px 13px 14px; }
  .rui-card-cat{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--brass);
    font-weight:600;
    margin:0 0 4px;
  }
  .rui-card-name{
    font-size:13.5px;
    font-weight:500;
    line-height:1.3;
    margin:0;
    color:var(--ink);
  }

  /* ---- Empty state ---- */
  .rui-empty{
    padding:60px 24px;
    text-align:center;
    color:var(--ink-soft);
  }
  .rui-empty .display{ font-size:20px; color:var(--ink); margin-bottom:6px; }

  /* ---- Section label for grouped (non-search) view ---- */
  .rui-section-label{
    padding:0 0 8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:600;
  }

  @media (max-width:560px){
    .rui-top{ padding:20px 16px 0; }
    .rui-tabs{ padding:12px 16px; }
    .rui-chips{ padding:14px 16px 0; }
    .rui-meta{ padding:14px 16px 0; }
    .rui-grid{ padding:14px 16px 0; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  }
</style>

  const clearBtn = document.getElementById('ruiClear');

  let activeCat = RENTALS_DATA[0].name;
  let activeSub = null; // null = all subcats of the active category

  function iconFor(cat){
    const d = ICONS[cat] || "M12 2 L22 12 L12 22 L2 12 Z";
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#1F3A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
  }

  function renderTabs(){
    tabsEl.innerHTML = RENTALS_DATA.map(cat => {
      const cls = 'rui-tab' + (cat.name===activeCat && !isSearching() ? ' active' : '');
      return '<div class="'+cls+'" data-cat="'+encodeURIComponent(cat.name)+'">'+
        cat.name+'<span class="count">'+cat.total+'+</span></div>';
    }).join('');
    Array.from(tabsEl.children).forEach(el=>{
      el.addEventListener('click', ()=>{
        searchEl.value='';
        clearBtn.classList.remove('show');
        activeCat = decodeURIComponent(el.getAttribute('data-cat'));
        activeSub = null;
        render();
      });
    });
  }

  function renderChips(){
    const cat = RENTALS_DATA.find(c=>c.name===activeCat);
    if(!cat || cat.flat || isSearching()){ chipsEl.innerHTML=''; return; }
    chipsEl.innerHTML = ['<div class="rui-chip'+(activeSub===null?' active':'')+'" data-sub="">All '+cat.name+'</div>']
      .concat(cat.subcategories.map(s=>{
        const cls='rui-chip'+(activeSub===s.name?' active':'');
        return '<div class="'+cls+'" data-sub="'+encodeURIComponent(s.name)+'">'+s.name+' <span style="opacity:.6">('+s.count+'+)</span></div>';
      })).join('');
    Array.from(chipsEl.children).forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.getAttribute('data-sub');
        activeSub = v ? decodeURIComponent(v) : null;
        render();
      });
    });
  }

  function isSearching(){ return searchEl.value.trim().length>0; }

  function cardHTML(catName, prodName, idx){
    const bg = SWATCH_BG[idx % SWATCH_BG.length];
    return '<div class="rui-card">'+
      '<div class="rui-card-swatch" style="background:'+bg+'">'+iconFor(catName)+'</div>'+
      '<div class="rui-card-body"><p class="rui-card-cat">'+catName+'</p><p class="rui-card-name">'+prodName+'</p></div>'+
    '</div>';
  }

  function render(){
    renderTabs();
    if(isSearching()){
      const q = searchEl.value.trim().toLowerCase();
      chipsEl.innerHTML='';
      let matches=[];
      RENTALS_DATA.forEach(cat=>{
        cat.subcategories.forEach(sub=>{
          const subHit = sub.name.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q);
          sub.products.forEach(p=>{
            if(subHit || p.toLowerCase().includes(q)){
              matches.push({cat:cat.name, sub:sub.name, product:p});
            }
          });
        });
      });
      metaEl.innerHTML = 'Showing <b>'+matches.length+'</b> result'+(matches.length===1?'':'s')+' for "<b>'+searchEl.value.trim()+'</b>" across all categories';
      if(matches.length===0){
        resultsEl.innerHTML=''; emptyEl.style.display='block';
      } else {
        emptyEl.style.display='none';
        resultsEl.innerHTML = '<div class="rui-grid">'+matches.map((m,i)=>cardHTML(m.cat, m.product, i)).join('')+'</div>';
      }
      return;
    }

    renderChips();
    const cat = RENTALS_DATA.find(c=>c.name===activeCat);
    let subs = cat.subcategories;
    if(activeSub) subs = subs.filter(s=>s.name===activeSub);

    const totalShown = subs.reduce((a,s)=>a+s.products.length,0);
    const totalConfirmed = subs.reduce((a,s)=>a+s.count,0);
    metaEl.innerHTML = cat.flat
      ? 'At least <b>'+cat.total+'</b> items in <b>'+cat.name+'</b>'
      : (activeSub ? 'At least <b>'+totalConfirmed+'</b> items in <b>'+activeSub+'</b>'
                   : 'At least <b>'+cat.total+'</b> items across <b>'+cat.subcategories.length+'</b> subcategories in <b>'+cat.name+'</b>');

    emptyEl.style.display='none';
    const showLabels = !cat.flat && !activeSub && subs.length > 1;
    let html='';
    subs.forEach(s=>{
      if(showLabels) html += '<div class="rui-section-label">'+s.name+' <span style="opacity:.6">('+s.count+'+)</span></div>';
      html += '<div class="rui-grid">'+s.products.map((p,i)=>cardHTML(cat.name,p,i)).join('')+'</div>';
    });
    resultsEl.innerHTML = html;
  }

  searchEl.addEventListener('input', ()=>{
    clearBtn.classList.toggle('show', searchEl.value.length>0);
    render();
  });
  clearBtn.addEventListener('click', ()=>{
    searchEl.value=''; clearBtn.classList.remove('show'); render();
  });

  render();
})();
</script>
